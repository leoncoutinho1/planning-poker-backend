services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: planning-poker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-planning_poker}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - planning-poker-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planning-poker-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-planning_poker}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - planning-poker-network
    restart: unless-stopped

  # Frontend (React/Vite buildado e servido com Nginx)
  frontend:
    build:
      context: ../planning-poker-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: planning-poker-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - planning-poker-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  planning-poker-network:
    driver: bridge

